/* ---------------- canvas sizing ---------------- */
function resize(){
  const r=cv.getBoundingClientRect(); const vw=Math.max(1,r.width), vh=Math.max(1,r.height);
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(clamp(H*vw/vh,960,1280));
  scale=Math.min(vw/W,vh/H); offX=(vw-W*scale)/2; offY=(vh-H*scale)/2;
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  OX=(W-ARENA)/2; crowdCache={};
}
window.addEventListener('resize',resize);

const Snd={ac:null,on:save.sound!==false,nb:null,out:null,mus:{on:false,next:0,step:0,key:5},
 init(){try{
   if(!this.ac){const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; this.ac=new AC(); this.out=this.ac.createGain(); this.out.gain.value=this.on?0.7:0; this.out.connect(this.ac.destination);
     const n=this.ac.sampleRate; this.nb=this.ac.createBuffer(1,n,n); const d=this.nb.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1; this.mus.next=this.ac.currentTime+0.1;}
   if(this.ac.state==='suspended')this.ac.resume();
 }catch(e){}},
 setOn(v){this.on=v; save.sound=v; persist(); if(this.out)this.out.gain.value=v?0.7:0;},
 osc(type,f0,f1,dur,vol,when){const a=this.ac; if(!a)return; const t=when||a.currentTime; const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(this.out); o.start(t); o.stop(t+dur+0.02);},
 noise(dur,vol,freq,type,when){const a=this.ac; if(!a)return; const t=when||a.currentTime; const s=a.createBufferSource(); s.buffer=this.nb; const f=a.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=freq; const g=a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); s.connect(f); f.connect(g); g.connect(this.out); s.start(t,Math.random()*0.5); s.stop(t+dur+0.02);},
 sfx(n){if(!this.ac||!this.on)return; try{switch(n){
  case 'hit':this.noise(0.12,0.5,1800);this.osc('sine',180,60,0.12,0.5);break;
  case 'heavyhit':this.noise(0.25,0.7,1200);this.osc('sine',140,40,0.25,0.8);break;
  case 'block':this.noise(0.06,0.35,4000,'highpass');this.osc('square',900,700,0.05,0.06);break;
  case 'whoosh':this.noise(0.12,0.12,2500,'bandpass');break;
  case 'jump':this.osc('sine',300,520,0.1,0.07);break;
  case 'thud':this.noise(0.2,0.5,400);this.osc('sine',90,40,0.2,0.5);break;
  case 'slam':this.noise(0.35,0.8,500);this.osc('sine',110,30,0.35,0.9);break;
  case 'grab':this.noise(0.08,0.3,900);break;
  case 'super':this.osc('sawtooth',110,880,0.6,0.14);this.noise(0.6,0.25,3000,'bandpass');break;
  case 'ko':this.osc('sawtooth',220,55,1.2,0.22);this.noise(1.0,0.4,700);break;
  case 'cheer':this.noise(0.9,0.22,1500,'bandpass');this.noise(0.7,0.12,3200,'bandpass');break;
  case 'ui':this.osc('triangle',660,880,0.06,0.1);break;
  case 'ok':this.osc('triangle',520,1040,0.12,0.14);break;
  case 'bell':this.osc('sine',1200,1180,0.9,0.22);this.osc('sine',1810,1800,0.7,0.09);break;
 }}catch(e){}},
 music(on,key){this.mus.on=on; if(key!==undefined)this.mus.key=key; if(this.ac){this.mus.next=this.ac.currentTime+0.06; this.mus.step=0;}},
 tick(){const a=this.ac,m=this.mus; if(!a||!m.on||!this.on||a.state!=='running')return; const sp=60/88/4;
  if(m.next<a.currentTime-0.5)m.next=a.currentTime+0.05;
  while(m.next<a.currentTime+0.12){const s=m.step%16, bar=(m.step>>4)%4, t=m.next;
   if(s===0||s===10||(s===7&&bar%2))this.osc('sine',150,42,0.28,0.5,t);
   if(s===4||s===12){this.noise(0.16,0.3,2200,'bandpass',t);this.osc('triangle',220,160,0.06,0.1,t);}
   if(s%2===0)this.noise(0.03,s%4===2?0.08:0.05,8000,'highpass',t);
   const root=55*Math.pow(2,(m.key+[0,0,3,-2][bar])/12);
   if(s===0||s===10||s===3)this.osc('triangle',root*(s===3?2:1),null,0.22,0.2,t);
   if(s===0||s===8)[1,1.189,1.498].forEach(r=>this.osc('square',root*4*r,null,0.18,0.014,t));
   m.next+=sp; m.step++;}}
};

  if(superFreeze>0&&superOwner===f)return blend(P_.GUARD,P_.SPEC_W,Math.min(1,(46-superFreeze)/12));
  switch(st){
   case 'idle':{const p=blend(P_.GUARD,P_.GUARD,0);const b=Math.sin(a*0.12);p.ua1+=b*4;p.fa1+=b*3;p.lean+=b*1.5;p.th1+=b*2;p.th2-=b*2;return p;}
   case 'walk':{const p=blend(P_.GUARD,P_.GUARD,0);const s=Math.sin(a*0.28*(f.wdir||1));p.th1=12+22*s;p.sh1=p.th1-12-Math.max(0,12*Math.cos(a*0.28));p.th2=-12-22*s;p.sh2=p.th2-6;p.lean+=3;return p;}
   case 'block':case 'blockstun':return P_.BLOCK;
   case 'jump':return P_.JUMP;
   case 'hitstun':return blend(P_.HIT,P_.GUARD,clamp(1-f.stun/12,0,1)*0.3);
   case 'thrown':return P_.HIT;
   case 'down':return f.air?blend(P_.HIT,P_.DOWN,clamp(-f.vy/10+0.5,0,1)):P_.DOWN;
   case 'getup':return blend(P_.DOWN,P_.GETUP,clamp(f.t/10,0,1)).lean>0?blend(P_.GETUP,P_.GUARD,clamp((f.t-10)/12,0,1)):blend(P_.DOWN,P_.GETUP,clamp(f.t/10,0,1));
   case 'win':{const p=blend(P_.WIN,P_.WIN,0);const b=Math.sin(a*0.2);p.ua1+=b*10;p.ua2-=b*10;return p;}
   case 'attack':{
     const m=f.move, n=f.mname, t=f.mt;
     const map={jab:[P_.JAB_W,P_.JAB_H],kick:[P_.KICK_W,P_.KICK_H],heavy:[P_.HEAVY_W,P_.HEAVY_H],akick:[P_.JUMP,P_.AKICK],throw:[P_.THROW_W,P_.THROW_W],special:[P_.SPEC_W,P_.SPEC_H],taunt:[P_.TAUNT,P_.TAUNT]}[n];
     const base=m.air?P_.JUMP:P_.GUARD;
     if(n==='taunt'){const p=blend(P_.TAUNT,P_.TAUNT,0);const b=Math.sin(a*0.35);p.fa1+=b*30;p.lean+=b*3;return p;}
     if(n==='throw'&&f.thrownOK&&t>=m.s+m.a)return blend(P_.THROW_W,P_.THROW_H,clamp((t-m.s-m.a)/8,0,1));
     if(t<m.s)return blend(base,map[0],t/Math.max(1,m.s));
     if(t<m.s+m.a)return blend(map[0],map[1],clamp((t-m.s+1)/2,0,1));
     return blend(map[1],base,clamp((t-m.s-m.a)/Math.max(1,m.r),0,1));
   }
  }
  return P_.GUARD;
}
function renderFighter(f,x,y,sc,pose,face,rot,alpha){

class Fighter{
  constructor(id,side){this.id=id;this.d=FIGHTERS[id];this.side=side;this.meter=0;this.buf={};this.held={left:false,right:false,up:false,block:false};this.resetRound();}
  resetRound(){Object.assign(this,{x:this.side?640:320,y:GROUND,vx:0,vy:0,face:this.side?-1:1,state:'idle',t:0,anim:(Math.random()*100)|0,move:null,mname:'',mt:0,done:false,hitLanded:false,thrownOK:false,combo:0,stun:0,air:false,inv:0,ko:false,cbuff:0,spin:0,dt:0,thrownBy:null,usedAir:false,wdir:1,holdBlock:false});this.maxhp=Math.round(1000*this.d.hp);this.hp=this.maxhp;this.trail=this.hp;}
  get actionable(){return !this.air&&(this.state==='idle'||this.state==='walk'||this.state==='block');}
  want(b){const v=this.buf[b];if(v!==undefined&&frame-v<=7){this.buf[b]=-999;return true;}return false;}
  addMeter(v){this.meter=Math.min(100,this.meter+v);}
  start(name){
    const m=MOVES[name]; this.state='attack';this.move=m;this.mname=name;this.mt=0;this.done=false;this.hitLanded=false;this.thrownOK=false;this.t=0;
    if(name==='special'){superFreeze=46;superOwner=this;this.meter=0;flash=1;Snd.sfx('super');floats.push({x:ARENA/2,y:200,txt:this.d.special,col:C.gold,size:52,life:70,max:70});M.hype=Math.min(100,M.hype+25);}
    else if(!m.taunt)Snd.sfx('whoosh');
  }
  update(o,act){
    this.t++;this.anim++; if(this.inv>0)this.inv--; if(this.cbuff>0)this.cbuff--;
    const h=this.held;
    if(this.actionable&&this.state!=='attack'&&!this.ko&&o)this.face=o.x>=this.x?1:-1;
    const fwd=this.face>0?h.right:h.left, back=this.face>0?h.left:h.right;
    this.holdBlock=!!(h.block||back);
    switch(this.state){
     case 'idle':case 'walk':case 'block':
      if(!act){this.state='idle';break;}
      if(this.meter>=100&&this.want('s'))this.start('special');
      else if(this.want('t'))this.start('throw');
      else if(this.want('h'))this.start('heavy');
      else if(this.want('k'))this.start('kick');
      else if(this.want('p'))this.start('jab');
      else if(this.want('taunt'))this.start('taunt');
      else if(h.up){this.air=true;this.vy=-14;this.vx=(fwd?1:back?-1:0)*this.face*4.2*this.d.spd;this.state='jump';this.t=0;this.usedAir=false;Snd.sfx('jump');}
      else if(h.block)this.state='block';
      else if(fwd){this.state='walk';this.wdir=1;this.x+=this.face*3.3*this.d.spd;}
      else if(back){this.state='walk';this.wdir=-1;this.x-=this.face*2.5*this.d.spd;}
      else this.state='idle';
      break;
     case 'jump':
      if(act&&!this.usedAir&&(this.want('k')||this.want('p')||this.want('h'))){this.usedAir=true;this.state='attack';this.move=MOVES.akick;this.mname='akick';this.mt=0;this.done=false;this.hitLanded=false;Snd.sfx('whoosh');}
      break;
     case 'attack':{
      const m=this.move; this.mt++;
      if(m.dash&&this.mt>=m.s-2&&this.mt<m.s+m.a)this.x+=this.face*m.dash;
      // combo cancel into a stronger move after a landed hit
      if(act&&this.hitLanded&&!m.air&&this.mt>=m.s+m.a&&this.mt<m.s+m.a+m.r){
        const nxt=(this.meter>=100&&this.want('s'))?'special':this.want('h')?'heavy':this.want('k')?'kick':null;
        if(nxt&&MOVES[nxt].rank>m.rank){this.start(nxt);break;}
      }
      if(!m.air&&this.mt>=m.s+m.a+m.r){
        if(m.taunt){this.addMeter(22*this.d.meterMul);M.hype=Math.min(100,M.hype+18);Snd.sfx('cheer');popText(this.x+OX*0,GROUND-210,'+HYPE',C.teal,24);}
        this.state='idle';this.move=null;
      }
      break;}
     case 'hitstun':case 'blockstun':
      this.stun--; if(this.stun<=0&&!this.air){if(this.state==='hitstun')this.combo=0;this.state='idle';}
      break;
     case 'down':
      if(!this.air){this.dt++; if(!this.ko&&this.dt>=46){this.state='getup';this.t=0;this.inv=30;}}
      break;
     case 'getup': if(this.t>=22){this.state='idle';this.combo=0;} break;
     case 'thrown': this.spin+=0.32; break;
    }
    // physics
    if(this.air){this.vy+=0.78;this.y+=this.vy;this.x+=this.vx;if(this.y>=GROUND){this.y=GROUND;this.air=false;this.vy=0;this.land();}}
    else{this.x+=this.vx;this.vx*=0.8;if(Math.abs(this.vx)<0.1)this.vx=0;}
    this.x=clamp(this.x,45,ARENA-45);
    if(this.trail>this.hp)this.trail-=Math.max(2,(this.trail-this.hp)*0.04);else this.trail=this.hp;
  }
  land(){
    if(this.state==='jump'||(this.state==='attack'&&this.move&&this.move.air)){this.state='idle';this.move=null;this.vx=0;dust(this.x,GROUND,4);}

  }

}
function tryHit(a,o){
  if(a.state!=='attack'||a.done)return; const m=a.move; if(!m||m.taunt)return;
  if(a.mt<m.s||a.mt>=m.s+m.a)return;
  const reach=m.reach+(m.isThrow?(a.d.throwReach||0):0); const dx=(o.x-a.x)*a.face;
  if(dx<-12||dx>reach)return;
  if(o.inv>0||o.ko||o.state==='down'||o.state==='getup'||o.state==='thrown')return;
  if(Math.abs((a.y-o.y))>150)return;
  if(m.isThrow){ if(o.air)return; a.done=true;a.thrownOK=true;o.state='thrown';o.thrownBy=a;o.air=true;o.vy=-12;o.vx=a.face*5.2;o.move=null;o.spin=0;a.addMeter(m.meter*a.d.meterMul);Snd.sfx('grab');hitstop=6;return;}
  a.done=true;
  const blocked=o.holdBlock&&!o.air&&(o.state==='idle'||o.state==='walk'||o.state==='block'||o.state==='blockstun');
  const hx=o.x-a.face*16, hy=m.air?Math.min(GROUND-90,a.y-70):GROUND-122;
  if(blocked){
    const chip=Math.round(m.dmg*10*a.d.pow*(m===MOVES.special?0.25:0.1)); if(o.hp-chip>0)o.hp-=chip;
    o.state='blockstun';o.stun=Math.max(6,(m.stun||14)-5);o.vx=a.face*(m.kb||3)*0.9;
    o.addMeter(3*(o.d.blockMeter||1)); if(o.d.blockMeter)o.cbuff=45; a.addMeter(1);
    spark(hx,hy,'block');Snd.sfx('block');hitstop=4;return;
  }
  let mult=a.d.pow; const counter=o.state==='attack'&&o.move&&o.mt<o.move.s;
  if(counter)mult*=1.25; if(a.cbuff>0){mult*=1.3;a.cbuff=0;}
  const sc=Math.max(0.35,1-(a.d.decay)*o.combo);
  const dmg=Math.round(m.dmg*10*mult*sc);
  o.combo++; a.hitLanded=true;
  o.damage(dmg,a);
  a.addMeter(m.meter*a.d.meterMul); o.addMeter(4);
  const kd=m.kd===true||o.air||(m.kd==='combo'&&o.combo>=3)||o.ko;
  if(kd){o.state='down';o.air=true;o.vy=o.ko?-11:-8;o.vx=a.face*(m.kb+2.5);o.dt=0;}
  else{o.state='hitstun';o.stun=m.stun;o.vx=a.face*m.kb;}
  o.move=null;o.t=0;
  const big=dmg>=100||m===MOVES.special;
  spark(hx,hy,m===MOVES.special?'super':big?'big':'hit');
  hitstop=o.ko?16:big?7:4; shake(big?9:3); Snd.sfx(big?'heavyhit':'hit');
  popText(o.x,GROUND-215,''+dmg,big?C.gold:'#fff',big?32:24);
  if(o.combo>=2)M.combo={side:a.side,n:o.combo,t:70};
  if(counter)popText(a.x,GROUND-250,'COUNTER',C.red,26);
  M.hype=Math.min(100,M.hype+dmg/9);
}

/* ---------------- AI ---------------- */
class AI{
  constructor(lv){this.lv=clamp(lv,1,5);this.hold=0;this.plan='';this.cd=30;this.saw=false;}
  think(f,o){
    const h=f.held; h.left=h.right=h.up=h.block=false;
    const L=this.lv-1, dist=Math.abs(o.x-f.x), toO=o.x>f.x?'right':'left', away=toO==='right'?'left':'right';
    const press=b=>{f.buf[b]=frame;};
    if(f.state==='attack'&&f.hitLanded&&!f.move.air){const r=f.move.rank; if(Math.random()<0.25+0.15*L){press(r<2?'k':r<3?'h':'s');} return;}
    const threat=o.state==='attack'&&o.move&&!o.move.taunt&&!o.move.isThrow&&o.mt<o.move.s+o.move.a&&dist<o.move.reach+45;
    if(threat&&f.actionable&&!this.saw){this.saw=true; if(Math.random()<[0.1,0.28,0.48,0.66,0.82][L]){this.plan='block';this.hold=16;}}
    if(!threat)this.saw=false;
    if(this.hold>0){this.hold--; if(this.plan==='block')h.block=true; else if(this.plan==='fwd')h[toO]=true; else if(this.plan==='back')h[away]=true; return;}
    if(f.state==='jump'){if(dist<130&&Math.random()<0.3)press('k');return;}
    if(!f.actionable)return;
    if(this.cd>0){this.cd--;return;}
    const r=Math.random(), react=[34,26,18,12,8][L];
    if(f.meter>=100&&dist<170&&r<0.18+0.1*L){press('s');this.cd=react;return;}
    if(o.state==='down'||o.state==='getup'){this.plan=dist>160?'fwd':'block';this.hold=12;return;}
    if(dist<74&&r<0.16+0.05*L){press('t');this.cd=react+10;return;}
    if(dist<96){const q=Math.random();press(q<0.42?'p':q<0.72?'k':'h');this.cd=react+((Math.random()*14)|0);return;}
    if(dist<124&&r<0.5){press('k');this.cd=react+8;return;}
    if(dist>280&&r<0.02){press('taunt');this.cd=40;return;}
    if(r<0.012*this.lv&&dist<300&&dist>140){h.up=true;h[toO]=true;this.cd=12;return;}
    if(r<0.07){this.plan='back';this.hold=8+((Math.random()*12)|0);return;}
    this.plan='fwd';this.hold=6+((Math.random()*14)|0);
  }
}

  const amp=1.5+hype*0.07;

/* ---------------- match ---------------- */
let M=null;
function startMatch(p1,p2,stage,opts){
  M={f:[new Fighter(p1,0),new Fighter(p2,1)],stage,round:1,wins:[0,0],timer:60*60,phase:'intro',pt:0,human:[true,!!opts.human2],ai:[null,opts.human2?null:new AI(opts.lv||2)],opts,hype:10,combo:null,paused:false,result:null,
   onKO(f,by){if(this.phase!=='fight')return;this.phase='ko';this.pt=0;this.winner=1-f.side;Snd.sfx('ko');Snd.sfx('cheer');flash=0.8;}};
  M.f[0].meter=opts.startMeter||0;
  parts=[];floats=[];hitstop=0;superFreeze=0;pbuf[0]={};pbuf[1]={};
  Snd.music(true,STAGES[stage].key); setScene('fight');
}
function nextRound(){M.round++;M.timer=60*60;M.phase='intro';M.pt=0;M.combo=null;for(const f of M.f)f.resetRound();parts=[];floats=[];}
function updateFight(){
  if(M.paused)return;
  updateFX(); M.pt++;
  if(hitstop>0){hitstop--;return;}
  if(superFreeze>0){superFreeze--;return;}
  if(M.combo&&--M.combo.t<=0)M.combo=null;
  M.hype=Math.max(0,M.hype-0.03);
  const ph=M.phase;
  if(ph==='intro'){ if(M.pt===8)Snd.sfx('bell'); if(M.pt>=110){M.phase='fight';M.pt=0;} }
  if(ph==='fight'){ if(--M.timer<=0){M.phase='timeup';M.pt=0;const a=M.f[0].hp/M.f[0].maxhp,b=M.f[1].hp/M.f[1].maxhp;M.winner=Math.abs(a-b)<0.001?-1:a>b?0:1;Snd.sfx('bell');} }
  if((ph==='ko')&&M.pt<70&&M.pt%3!==0)return; // slow motion
  const act=M.phase==='fight';
  for(let i=0;i<2;i++){const f=M.f[i],o=M.f[1-i];
    if(M.human[i]){const hd=heldDirs(i);Object.assign(f.held,hd);f.buf=pbuf[versus()?i:0];}
    else if(act)M.ai[i].think(f,o); else{f.held.left=f.held.right=f.held.up=f.held.block=false;}
  }
  M.f[0].update(M.f[1],act); M.f[1].update(M.f[0],act);
  // push boxes
  const a=M.f[0],b=M.f[1],dx=b.x-a.x,min=64;
  if(Math.abs(dx)<min&&a.state!=='thrown'&&b.state!=='thrown'&&Math.abs(a.y-b.y)<100){const p=(min-Math.abs(dx))/2*(dx>=0?1:-1);a.x=clamp(a.x-p,45,ARENA-45);b.x=clamp(b.x+p,45,ARENA-45);}
  if(act||M.phase==='ko'&&M.pt<4){tryHit(a,b);tryHit(b,a);}
  if(M.phase==='ko'||M.phase==='timeup'){
    const w=M.winner;
    if(M.pt===100&&w>=0){const wf=M.f[w];if(!wf.air&&wf.state!=='down'){wf.state='win';wf.move=null;}}
    if(M.pt===110&&w>=0&&M.wins[w]+1>=2)confetti();
    if(M.pt>=190){
      if(w>=0)M.wins[w]++;
      if(w>=0&&M.wins[w]>=2){M.phase='done';M.pt=0;endMatch(w);}
      else nextRound();
    }
  }
}
function endMatch(w){
  Snd.music(true,5);
  const o=M.opts; if(o.onEnd)o.onEnd(w); else setScene('result',{winner:w});
}

    ctx.fillStyle='rgba(0,0,0,0.65)';rrect(x0-4,y0-4,bw+8,30,6);ctx.fill();
    const ratio=f.hp/f.maxhp, tr=f.trail/f.maxhp;
    ctx.fillStyle=C.red; const tw=bw*tr; ctx.fillRect(s?x0+bw-tw:x0,y0,tw,22);
    const g=ctx.createLinearGradient(0,y0,0,y0+22);g.addColorStop(0,ratio<0.25?'#ff8a3d':'#ffe08a');g.addColorStop(1,ratio<0.25?'#d9481e':C.gold);
    ctx.fillStyle=g; const hw=bw*ratio; ctx.fillRect(s?x0+bw-hw:x0,y0,hw,22);
    ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(s?x0+bw-hw:x0,y0,hw,5);
    txt(f.d.alias,s?x0+bw:x0,y0+44,24,C.ink,s?'right':'left',FD,true);
    txt(f.d.name.toUpperCase(),s?x0+bw-ctx.measureText(f.d.alias).width-12:x0+ctx.measureText(f.d.alias).width+12,y0+46,16,C.dim,s?'right':'left',FB,true);
    for(let k=0;k<2;k++){const cx=s?x0+bw-12-k*22:x0+12+k*22;ctx.fillStyle=M.wins[s]>k?C.gold:'rgba(255,255,255,0.15)';ctx.beginPath();ctx.arc(cx,y0+70,7,0,Math.PI*2);ctx.fill();}

    const mw=bw*0.62, mx=s?x0+bw-mw:x0, my=y0+86;

}
function drawAnnouncer(){
  const ph=M.phase,t=M.pt;
  const big=(s,col,size)=>{const k=Math.min(1,t/8);ctx.save();ctx.translate(W/2,H*0.4);ctx.scale(0.6+0.4*k,0.6+0.4*k);txt(s,0,0,size,col,'center',FD,true);ctx.restore();};
  if(ph==='intro'){ if(t<70)big('ROUND '+M.round,C.ink,84); else big('FIGHT!',C.gold,110); }
  if(ph==='ko'&&t>20)big('K.O.',C.red,130);
  if(ph==='timeup')big(M.winner<0?'DRAW':'TIME',C.ink,96);
  if((ph==='ko'||ph==='timeup')&&t>110&&M.winner>=0){txt(M.f[M.winner].d.alias+' WINS',W/2,H*0.4+90,40,C.gold,'center',FD,true);}
  if(superFreeze>0){ctx.fillStyle=`rgba(0,0,0,${0.45*Math.min(1,superFreeze/10)})`;ctx.fillRect(0,0,W,H);}

function renderFight(){
  drawStage(M.stage,frame,M.hype);
  const sx=shakeAmt?R(-shakeAmt,shakeAmt):0, sy=shakeAmt?R(-shakeAmt,shakeAmt)*0.6:0;
  ctx.save();ctx.translate(OX+sx,sy);
  for(const f of M.f){const air=GROUND-f.y;ctx.fillStyle=`rgba(0,0,0,${0.35-Math.min(0.25,air/600)})`;ctx.beginPath();ctx.ellipse(f.x,GROUND+4,46-Math.min(25,air/8),9,0,0,Math.PI*2);ctx.fill();}
  const order=[...M.f].sort((a,b)=>(a.state==='attack'?1:0)-(b.state==='attack'?1:0));
  for(const f of order){
    const blink=f.inv>0&&f.state!=='getup'&&frame%6<3;
    const rot=f.state==='thrown'?f.spin*f.face*-1:0;
    renderFighter(f,f.x,f.y,1,getPose(f),f.face,rot,blink?0.5:1);
    if(f.meter>=100&&f.state!=='down'){ctx.globalAlpha=0.25+0.15*Math.sin(frame*0.2);ctx.fillStyle=C.teal;ctx.beginPath();ctx.ellipse(f.x,GROUND+2,52,11,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}

  if(flash>0.02){ctx.fillStyle=`rgba(255,250,230,${flash*0.6})`;ctx.fillRect(0,0,W,H);}

  if(M.paused){ctx.fillStyle='rgba(8,7,10,0.8)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,150,72,C.ink,'center',FD);

let scene='title', sceneT=0, sceneData={}, ui={buttons:[],sel:0}, hoverSel=-1;
const flow={}; // selections in progress
function setScene(s,data){if(s!=='fight'&&s!=='result'&&s!=='ending'){parts=[];floats=[];}scene=s;sceneT=0;sceneData=data||{};ui.sel=0;ui.buttons=[];if(s!=='fight')Snd.music(true,5);}
function menuButtons(list,cx,y0,w,h,gap){
  w=w||320;h=h||52;gap=gap||12;
  list.forEach((it,i)=>{const b={x:cx-w/2,y:y0+i*(h+gap),w,h,label:it[0],act:it[1],sub:it[2],dis:it[3]};ui.buttons.push(b);drawBtn(b,i===ui.sel);});

function drawBtn(b,sel){
  ctx.save();
  ctx.fillStyle=sel?C.gold:'rgba(14,12,18,0.82)';rrect(b.x,b.y,b.w,b.h,8);ctx.fill();
  ctx.strokeStyle=sel?C.gold:'rgba(245,183,10,0.35)';ctx.lineWidth=2;ctx.stroke();
  if(sel){ctx.fillStyle='#0d0c10';ctx.beginPath();ctx.moveTo(b.x+16,b.y+b.h/2-7);ctx.lineTo(b.x+26,b.y+b.h/2);ctx.lineTo(b.x+16,b.y+b.h/2+7);ctx.fill();}
  const col=b.dis?'#6c665e':sel?'#0d0c10':C.ink;
  if(b.sub){txt(b.label.toUpperCase(),b.x+b.w/2,b.y+b.h/2-9,24,col,'center',FD);txt(b.sub,b.x+b.w/2,b.y+b.h/2+14,15,sel?'#2a2410':C.dim,'center',FB);}
  else txt(b.label.toUpperCase(),b.x+b.w/2,b.y+b.h/2+1,26,col,'center',FD);
  ctx.restore();
}
function clickAt(x,y){
  if(scene==='fight'&&!(M&&M.paused))return;
  if(scene==='talk'){talkAdvance(x,y);return;}
  for(let i=0;i<ui.buttons.length;i++){const b=ui.buttons[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
    if(b.focusFirst&&ui.sel!==i){ui.sel=i;Snd.sfx('ui');return;}

function menuNav(d,code){
  if(scene==='fight'){
    if(d==='pause'||(d==='back'&&code!=='KeyJ')){if(M&&M.phase!=='done'){M.paused=!M.paused;Snd.sfx('ui');}return;}
    if(!(M&&M.paused))return;
    if(code&&/^Key[ASDWJ]$/.test(code)&&d!=='ok'&&code!=='KeyW'&&code!=='KeyS')return;
  } else if(code&&KEYMAP[code]&&d!=='ok'&&!(code==='KeyJ'))return;
  if(scene==='talk'){if(d==='ok')talkAdvance();if(d==='back')talkSkip();return;}
  const n=ui.navCount||ui.buttons.length; if(!n&&d!=='back')return;
  const grid=ui.grid||1;
  if(d==='up'){ui.sel=(ui.sel-grid+n*4)%n;Snd.sfx('ui');}
  else if(d==='down'){ui.sel=(ui.sel+grid)%n;Snd.sfx('ui');}
  else if(d==='left'&&grid>1){ui.sel=(ui.sel-1+n)%n;Snd.sfx('ui');}
  else if(d==='right'&&grid>1){ui.sel=(ui.sel+1)%n;Snd.sfx('ui');}
  else if(d==='ok'){const b=ui.buttons[ui.sel];if(b&&!b.dis){Snd.sfx('ok');b.act();}}
  else if(d==='back'){Snd.sfx('ui');if(sceneData.onBack)sceneData.onBack();else if(scene!=='title')setScene('title');}
}

/* ---------------- story runner ---------------- */
let ST=null;
function startStory(id){
  const s=STORY[id];
  ST={id,step:-1,flag:null,queue:[]};
  // build sequence
  ST.queue.push({type:'talk',lines:s.intro,stage:FIGHTERS[id].home});
  s.fights.forEach((f,i)=>{
    if(i===3)ST.queue.push({type:'choice'});
    ST.queue.push({type:'talk',lines:f.lines,stage:f.stage,opp:f.opp,vs:i});
    ST.queue.push({type:'fight',opp:f.opp,stage:f.stage,idx:i});
  });
  ST.queue.push({type:'ending'});
  storyNext();
}
function storyNext(){
  ST.step++; const q=ST.queue[ST.step]; if(!q){setScene('title');return;}
  if(q.type==='talk'){setScene('talk',{lines:q.lines,stage:q.stage,i:0,ch:0,vs:q.vs,opp:q.opp});}
  else if(q.type==='choice'){setScene('choice');}
  else if(q.type==='fight'){runStoryFight(q);}
  else if(q.type==='ending'){save.cleared[ST.id]=ST.flag||'clean';persist();setScene('ending');}
}
function runStoryFight(q){
  let lv=STORY_AI[q.idx]+(ST.flag==='clean'&&q.idx>=3?1:0);
  startMatch(ST.id,q.opp,q.stage,{lv,mode:'story',startMeter:ST.flag==='deal'&&q.idx>=3?100:0,onEnd:(w)=>{
    if(w===0){storyNext();} else setScene('storylose',{q});
  }});
}
function talkAdvance(){
  const d=sceneData, line=d.lines[d.i]; if(!line)return;
  if(d.ch<line[1].length){d.ch=line[1].length;return;}
  d.i++;d.ch=0;Snd.sfx('ui');
  if(d.i>=d.lines.length)storyNext();
}
function talkSkip(){storyNext();}
function speakerInfo(sp){
  if(sp==='N')return {name:'',d:null};
  if(sp==='H')return {name:'THE HOST',d:FIGHTERS.host};
  return {name:FIGHTERS[sp].alias,d:FIGHTERS[sp]};
}
function renderTalk(){
  const d=sceneData; backdrop(d.stage,0.5);
  const line=d.lines[Math.min(d.i,d.lines.length-1)];

  if(d.vs!==undefined){txt('FIGHT '+(d.vs+1)+' OF 5',30,40,26,C.gold,'left',FD,true);txt(FIGHTERS[ST.id].alias+'  vs  '+FIGHTERS[d.opp].alias,30,66,18,C.ink,'left',FB,true);}
  if(sp.d){const left=line[0]===ST.id; const x=left?W*0.22:W*0.78;
    ctx.save();renderFighter({d:sp.d,anim:frame},x,H+150,2.6,P_.GUARD,left?1:-1);ctx.restore();}
  const bx=36,by=H-158,bw=W-72,bh=124;
  ctx.fillStyle='rgba(10,9,13,0.92)';rrect(bx,by,bw,bh,10);ctx.fill();ctx.strokeStyle=sp.d?C.gold:'rgba(255,255,255,0.2)';ctx.lineWidth=2;ctx.stroke();
  if(sp.name){ctx.fillStyle=C.gold;rrect(bx+20,by-18,ctx.measureText(sp.name).width+30,34,6);ctx.font=`22px ${FD}`;const nw=ctx.measureText(sp.name).width;rrect(bx+20,by-18,nw+30,34,6);ctx.fill();txt(sp.name,bx+35,by-1,22,'#0d0c10','left',FD);}
  const shown=line[1].slice(0,Math.floor(d.ch));
  wrap(shown,bw-60,25,sp.d?FB:FB).forEach((l,k)=>txt(l,bx+30,by+38+k*30,25,sp.d?C.ink:'#d9d2c4','left',FB));
  if(d.ch>=line[1].length&&frame%40<26)txt('TAP / ENTER ▶',bx+bw-24,by+bh-18,15,C.gold,'right',FD);
  const sk={x:W-130,y:86,w:100,h:36,label:'Skip',act:talkSkip,noHover:true};drawBtn(sk,false);ui.buttons=[sk];
}

/* ---------------- main loop ---------------- */
function update(){
  frame++; sceneT++; pollPads(); Snd.tick();
  if(scene==='fight'&&M)updateFight(); else updateFX();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,offX*dpr,offY*dpr);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ui.navCount=0;
  if(scene!=='fight'&&scene!=='talk'){ui.buttons=[];ui.grid=1;}
  switch(scene){
   case 'title':renderTitle();break;
   case 'howto':renderHowto();break;
   case 'select':renderSelect();break;
   case 'stage':renderStageSel();break;
   case 'difficulty':renderDifficulty();break;
   case 'fight':ui.buttons=[];ui.grid=1;if(M)renderFight();break;
   case 'result':renderResult();break;
   case 'talk':renderTalk();break;
   case 'choice':renderChoice();break;
   case 'storylose':renderStoryLose();break;
   case 'ending':renderEnding();break;
  }
  if(scene!=='fight'&&parts.length)drawFX();
  if(ui.sel>=ui.buttons.length&&ui.buttons.length)ui.sel=0;
  ctx.restore();
}
let last=performance.now(),acc=0;
function loop(now){
  requestAnimationFrame(loop);
  acc+=Math.min(100,now-last); last=now; let n=0;
  while(acc>=1000/60&&n<4){update();acc-=1000/60;n++;}
  render();
}
resize();
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('40px Anton'),document.fonts.load('600 20px "Barlow Condensed"')]).catch(()=>{});}
requestAnimationFrame(loop);
window.CP={get scene(){return scene;},get M(){return M;},setScene,startMatch,FIGHTERS,STAGES,STORY,flow,get frame(){return frame;},pbuf,keys,AI,step(n){for(let i=0;i<n;i++)update();},startStory,get ST(){return ST;}};
</script>
